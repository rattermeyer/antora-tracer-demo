services:
  neo4j:
    image: neo4j:5-community
    container_name: tracer-neo4j
    ports:
      - "7474:7474"   # HTTP (Neo4j Browser)
      - "7687:7687"   # Bolt (drivers)
    environment:
      - NEO4J_AUTH=neo4j/tracer123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_allow__csv__import__from__file__urls=true
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  mermaid:
    image: yuzutech/kroki-mermaid:0.32.0@sha256:866257fc2aff924533b19f68787ea4a43ad8ac99937e8079d07a2e9551d413fa
    expose:
      - "8002"
  kroki:
    image: yuzutech/kroki:0.32.0@sha256:877f41306141ea2ceaf6cfb0a4d9d5b4afaf6d147413963712fc7f5544799c6c
    ports:
      - "8000:8000"
    depends_on:
      - mermaid
    environment:
      - KROKI_MERMAID_HOST=mermaid
      - KROKI_SAFE_MODE=UNSAFE
volumes:
  neo4j-data:
  neo4j-logs:
