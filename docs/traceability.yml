# Self-Traceability Configuration
# Extends the requirements-engineering preset with use_case role for the example site

extends: requirements-engineering

roles:
  - use_case
  - process_requirement

relations:
  use_case:
    requirement: ["leads_to"]
  requirement:
    use_case: ["is_derived_from"]
  process_requirement:
    requirement: ["validates"]
    design: ["considered_by"]

matrices:
  - name: usecases-to-requirements
    description: "Use cases traced to requirements"
    rows: use_case
    columns: [requirement]
    coverageRelations:
      requirement: [leads_to]
  - name: process-to-product
    description: "Process requirements traced to product requirements"
    rows: process_requirement
    columns: [requirement]
    coverageRelations:
      requirement: [validates]
  - name: process-to-design
    description: "Process requirements traced to architectural decisions"
    rows: process_requirement
    columns: [design]
    coverageRelations:
      design: [considered_by]

inverseLabels:
  leads_to: "is_derived_from"
  considered_by: "considers"
